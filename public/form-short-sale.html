
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario Short Sale</title>
</head>
<body>
  <form
    name="solicitudes-short-sale"
    method="POST"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="solicitudes-short-sale" />
    <input type="text" name="bot-field" />
    <input type="text" name="nombre" />
    <input type="tel" name="telefono" />
    <input type="email" name="email" />
    <input type="text" name="municipio" />
    <input type="text" name="tipo_propiedad" />
    <input type="text" name="banco_hipotecario" />
    <input type="text" name="estado_hipoteca" />
    <input type="text" name="notificacion_ejecucion" />
  </form>
</body>
</html>
