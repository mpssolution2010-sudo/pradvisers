
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Solicitud para vender terrenos - Property Advisers</title>
</head>
<body>

  <form
    name="solicitudes-terrenos-vender"
    method="POST"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    action="/gracias"
  >

    <input
      type="hidden"
      name="form-name"
      value="solicitudes-terrenos-vender"
    />

    <p hidden>
      <label>
        No completar este campo:
        <input name="bot-field" />
      </label>
    </p>

    <p>
      <label>
        Nombre completo:
        <input type="text" name="nombre" />
      </label>
    </p>

    <p>
      <label>
        Número de teléfono:
        <input type="tel" name="telefono" />
      </label>
    </p>

    <p>
      <label>
        Correo electrónico:
        <input type="email" name="email" />
      </label>
    </p>

    <p>
      <label>
        Municipio donde está el terreno:
        <input type="text" name="municipio" />
      </label>
    </p>

    <p>
      <label>
        Información del terreno:
        <textarea name="mensaje"></textarea>
      </label>
    </p>

    <button type="submit">
      Enviar solicitud
    </button>

  </form>

</body>
</html>
