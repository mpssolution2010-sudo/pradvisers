<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario de compradores</title>
</head>
<body>
  <form
    name="solicitudes-compradores"
    method="POST"
    data-netlify="true"
    netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="solicitudes-compradores" />
    <input type="text" name="bot-field" />
    <input type="text" name="nombre" />
    <input type="tel" name="telefono" />
    <input type="email" name="correo" />
    <input type="text" name="municipio" />
    <input type="text" name="presupuesto" />
    <input type="text" name="financiamiento" />
    <input type="text" name="servicio" />
  </form>
</body>
</html>
