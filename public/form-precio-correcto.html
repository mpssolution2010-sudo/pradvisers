
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario Precio Correcto</title>
</head>
<body>
  <form
    name="solicitudes-precio-correcto"
    method="POST"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    hidden
  >
    <input type="hidden" name="form-name" value="solicitudes-precio-correcto" />
    <input type="text" name="bot-field" />
    <input type="text" name="nombre" />
    <input type="tel" name="telefono" />
    <input type="email" name="email" />
    <input type="text" name="municipio" />
    <input type="text" name="tipo_propiedad" />
    <input type="number" name="precio_estimado" />
  </form>
</body>
</html>
