<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña | Property Advisers</title>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #071a32;
        color: #071a32;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: min(90%, 440px);
        background: white;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }

      .marca {
        color: #c9a646;
        font-weight: 800;
        letter-spacing: 0.15em;
        font-size: 12px;
      }

      h1 {
        margin: 12px 0 8px;
      }

      p {
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="marca">PROPERTY ADVISERS REAL ESTATE</div>

      <h1>Recuperar contraseña</h1>

      <p>
        Estamos procesando tu enlace de recuperación.
      </p>

      <p>
        En unos segundos se abrirá la ventana para crear tu nueva contraseña.
      </p>
    </div>

    <script>
      netlifyIdentity.on('init', function () {
        const hash = window.location.hash

        if (hash.includes('recovery_token=')) {
          netlifyIdentity.open('recovery')
        }
      })

      netlifyIdentity.init({
        locale: 'es',
      })

      netlifyIdentity.on('login', function () {
        netlifyIdentity.close()
        window.location.href = '/admin'
      })

      netlifyIdentity.on('error', function (error) {
        console.error('Error de Identity:', error)
      })
    </script>
  </body>
</html>
